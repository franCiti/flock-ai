# Kafka broker configuration (plan section 7.2, D09, D17, D25).
# The TLS material is appended at start-up by entrypoint.sh (PEM values inline).

# --- KRaft: a single node acting as broker and controller -----------------------------------
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@localhost:9095

# --- Listeners: every one requires TLS and a client certificate -----------------------------
# INTERNAL: other containers (kafka:9094) · EXTERNAL: the PC (localhost:9093) · CONTROLLER: KRaft
listeners=INTERNAL://:9094,EXTERNAL://:9093,CONTROLLER://localhost:9095
advertised.listeners=INTERNAL://kafka:9094,EXTERNAL://localhost:9093
listener.security.protocol.map=INTERNAL:SSL,EXTERNAL:SSL,CONTROLLER:SSL
inter.broker.listener.name=INTERNAL
controller.listener.names=CONTROLLER

ssl.client.auth=required
ssl.protocol=TLSv1.3
ssl.enabled.protocols=TLSv1.3
ssl.keystore.type=PEM
ssl.truststore.type=PEM

# --- Authorization: deny by default, the user is the certificate CN --------------------------
ssl.principal.mapping.rules=RULE:^.*CN=([^,]+).*$/$1/,DEFAULT
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
super.users=User:kafka;User:kafka-admin
allow.everyone.if.no.acl.found=false

# --- Topics are created only by kafka-init (setup.sh) -----------------------------------------
auto.create.topics.enable=false
log.dirs=/var/lib/kafka/data
num.partitions=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0
