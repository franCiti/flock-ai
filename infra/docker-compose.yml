# flock-ai local environment (plan section 7.5). Run from the repository root: docker compose up

services:
  # One-shot: creates the development CA and the service certificates if they are missing.
  certs-init:
    image: alpine/openssl:3.5.9
    entrypoint: ["sh", "/certs/generate.sh"]
    environment:
      FLOCK_CERTS_IN_CONTAINER: "1"
    volumes:
      - ./certs:/certs
    restart: "no"

  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    # Copies the TLS material with the permissions PostgreSQL requires, then starts it with TLS.
    entrypoint: ["/bin/sh", "/etc/flock/entrypoint.sh"]
    environment:
      POSTGRES_DB: flock_ai
      # Superuser for administration inside the container only (pg_hba.conf: local peer).
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
    volumes:
      - ./postgres:/etc/flock:ro
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./certs/out/postgres:/certs:ro
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    depends_on:
      certs-init:
        condition: service_completed_successfully
    healthcheck:
      # Runs as the postgres OS user: pg_hba.conf only allows local "peer" logins for it.
      test: ["CMD", "gosu", "postgres", "pg_isready", "--dbname=flock_ai"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    # Starts as root to read its private key, then drops to the image user (entrypoint.sh).
    user: "0"
    entrypoint: ["bash", "/etc/flock/kafka/entrypoint.sh"]
    environment:
      CLUSTER_ID: p6NqDue9RVO9NL09dk-4vQ
    volumes:
      - ./kafka:/etc/flock/kafka:ro
      - ./certs/out/kafka:/certs:ro
      - kafka-data:/var/lib/kafka/data
    ports:
      # EXTERNAL listener, for clients running on the PC (e.g. flock-ask).
      - "9093:9093"
    depends_on:
      certs-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - /opt/kafka/bin/kafka-broker-api-versions.sh
        - --bootstrap-server=kafka:9094
        - --command-config=/tmp/flock/healthcheck.properties
      interval: 10s
      timeout: 15s
      start_period: 20s
      retries: 12

  # One-shot: creates the topics and ACLs (idempotent).
  kafka-init:
    image: apache/kafka:4.3.1
    # One-shot admin tool: root, to read the kafka-admin private key (mode 600, owned by root).
    user: "0"
    entrypoint: ["bash", "/etc/flock/kafka/setup.sh"]
    volumes:
      - ./kafka:/etc/flock/kafka:ro
      - ./certs/out/kafka-admin:/certs:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  # Agent Worker: answers agent.requests (plan section 4.1). Without an API key, LLM_PROVIDER=fake
  # in .env runs it with canned answers (D41).
  agent:
    build: &agent-service-build
      context: ..
      dockerfile: agent-service/Dockerfile
    image: flock-ai/agent-service:dev
    command: ["flock-agent"]
    environment:
      <<: &agent-service-connections
        POSTGRES_HOST: postgres
        POSTGRES_PORT: "5432"
        KAFKA_BOOTSTRAP_SERVERS: kafka:9094
        LOG_LEVEL: ${LOG_LEVEL:-INFO}
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
        EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-}
      TLS_CERT_FILE: /run/flock/certs/agent.crt
      TLS_KEY_FILE: /run/flock/certs/agent.key
      TLS_CA_FILE: /run/flock/certs/ca.crt
      POSTGRES_USER: agent
      HEARTBEAT_FILE: /run/flock/heartbeat
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_FAST_MODEL: ${LLM_FAST_MODEL:-}
      CONVERSATION_TTL: ${CONVERSATION_TTL:-}
      ANSWER_TIMEOUT: ${ANSWER_TIMEOUT:-}
      FIRST_TOKEN_TARGET: ${FIRST_TOKEN_TARGET:-}
      MAX_QUESTION_CHARS: ${MAX_QUESTION_CHARS:-}
      MAX_REQUESTS_PER_MINUTE: ${MAX_REQUESTS_PER_MINUTE:-}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-}
      RETRIEVAL_CANDIDATES: ${RETRIEVAL_CANDIDATES:-}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-}
      REFERRAL_MIN_SCORE: ${REFERRAL_MIN_SCORE:-}
      HISTORY_TURNS: ${HISTORY_TURNS:-}
    volumes:
      - ./certs/out/agent:/certs:ro
      - embedding-models:/models
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      # The worker touches its heartbeat file on every poll of agent.requests (about every 0.5 s).
      test:
        - CMD
        - python
        - -c
        - "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/run/flock/heartbeat') > 30)"
      interval: 10s
      timeout: 5s
      # The first start downloads the embedding model (about 0.2 GB) into the shared cache.
      start_period: 300s
      retries: 3
    restart: unless-stopped

  # Ingestion Worker: runs the jobs of ingestion.jobs over data/knowledge (or KNOWLEDGE_HOST_DIR),
  # the only service that sees the files (plan 7.5). A manual update without Kafka:
  # `docker compose run --rm ingestion flock-ingest run`.
  ingestion:
    build: *agent-service-build
    image: flock-ai/agent-service:dev
    command: ["flock-ingest", "worker"]
    environment:
      <<: *agent-service-connections
      TLS_CERT_FILE: /run/flock/certs/ingestion.crt
      TLS_KEY_FILE: /run/flock/certs/ingestion.key
      TLS_CA_FILE: /run/flock/certs/ca.crt
      POSTGRES_USER: ingestion
      HEARTBEAT_FILE: /run/flock/heartbeat
      MAX_FILE_MB: ${MAX_FILE_MB:-}
    volumes:
      - ./certs/out/ingestion:/certs:ro
      - embedding-models:/models
      # Read-write: the ingestion creates missing persona profiles (plan 5.7).
      - ${KNOWLEDGE_HOST_DIR:-../data/knowledge}:/knowledge
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      # The worker touches its heartbeat file on every poll of ingestion.jobs (about every 0.5 s).
      test:
        - CMD
        - python
        - -c
        - "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/run/flock/heartbeat') > 30)"
      interval: 10s
      timeout: 5s
      start_period: 300s
      retries: 3
    restart: unless-stopped

  # Core API: REST API and SSE for the web app, Kafka client of the agent (plan section 6). Inside the
  # Docker network only: the web app (nginx) publishes it on the PC.
  core-api:
    build:
      context: ..
      dockerfile: core-api/Dockerfile
    image: flock-ai/core-api:dev
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      TLS_CERT_FILE: /run/flock/certs/core-api.crt
      TLS_KEY_FILE: /run/flock/certs/core-api.key
      TLS_CA_FILE: /run/flock/certs/ca.crt
      # Spring reads an empty variable as an empty value, not as missing: these defaults repeat
      # those of application.yml.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      INGESTION_INTERVAL: ${INGESTION_INTERVAL:-30m}
      ANSWER_TIMEOUT: ${ANSWER_TIMEOUT:-2m}
      MAX_QUESTION_CHARS: ${MAX_QUESTION_CHARS:-2000}
    volumes:
      - ./certs/out/core-api:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      # Spring Boot Actuator (plan 7.6); the image has no curl, bash speaks HTTP by itself.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/8080
          && printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          && grep -q '"status":"UP"' <&3
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # Web app (plan 6.1): the front, with /api and /docs proxied to the Core API on the same origin.
  # The demo: http://localhost:8080
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    image: flock-ai/web:dev
    ports:
      - "8080:8080"
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
  # Embedding model cache, shared by agent and ingestion.
  embedding-models:
