# Client authentication (plan section 7.3, D17). Connections matching no line are rejected.

# TYPE   DATABASE  USER      ADDRESS  METHOD

# Administration inside the container only: docker compose exec --user postgres postgres psql flock_ai
local    all       postgres           peer

# Services: TLS plus a client certificate signed by the flock-ai CA. The certificate CN is
# mapped to a database role in pg_ident.conf (map "services"); unmapped CNs are rejected.
hostssl  flock_ai  all       all      cert map=services
