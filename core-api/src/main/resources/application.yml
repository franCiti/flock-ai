spring:
  application:
    name: core-api
  # Without an explicit profile the Core API connects with mutual TLS (application-mtls.yml).
  # Tests use the "test" profile with plain ephemeral containers.
  profiles:
    default: mtls

  # PostgreSQL: role core_api, owner of the schema "core" (plan 3.1, 7.3).
  datasource:
    username: core_api
  flyway:
    schemas: core
    default-schema: core
    # The schema exists already: created with its owner by infra/postgres/initdb.
    create-schemas: false

  # Kafka client of the agent and of the ingestion (plan 6.5).
  kafka:
    client-id: core-api
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      # The ACLs only let core-api use its own consumer group (infra/kafka/setup.sh).
      group-id: core-api
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # Offsets are committed after each record is processed (read copies are idempotent upserts).
      ack-mode: record

  mvc:
    # Errors as Problem Details, RFC 7807 (plan 6.2)
    problemdetails:
      enabled: true

server:
  port: 8080
  servlet:
    session:
      cookie:
        # Session cookie (D16, plan 6.2). Browsers accept Secure cookies on http://localhost;
        # SESSION_COOKIE_SECURE=false is only for other plain-HTTP development hosts.
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:true}

flock:
  chat:
    # How long the agent may take to answer (HU6.3): the replies of a request in progress are kept
    # that long for a browser that reconnects (plan 6.4).
    answer-timeout: ${ANSWER_TIMEOUT:2m}
    # The same limit as the agent (HU15): the web app counts characters against it.
    max-question-chars: ${MAX_QUESTION_CHARS:2000}
  # Knowledge updates (D31): one every INGESTION_INTERVAL, besides the manual ones.
  ingestion:
    interval: ${INGESTION_INTERVAL:30m}
  # Initial user, created only when core.app_user is empty (plan 3.4).
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}

# Only the health endpoint is exposed; the details stay internal.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# OpenAPI generated from the code and Swagger UI under /docs (D32, plan 1.4).
springdoc:
  api-docs:
    path: /docs/openapi
  swagger-ui:
    path: /docs/swagger-ui
