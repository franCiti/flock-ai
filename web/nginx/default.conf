# nginx of the web image (plan 6.1): the built front, and /api and /docs proxied to the Core API on
# the same origin (no CORS; the session cookie just works).

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # --- Core API ---------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://core-api:8080;
        include /etc/nginx/conf.d/proxy.inc;
        # Server-Sent Events of the chat (plan 6.4): no buffering, and long-lived connections.
        # The Core API sends a comment every 20 s, well within the timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Swagger UI, OpenAPI and AsyncAPI (plan 2.7): pages of their own, with their own scripts.
    location /docs {
        proxy_pass http://core-api:8080;
        include /etc/nginx/conf.d/proxy.inc;
    }

    # Actuator stays inside the Docker network (plan 7.6).
    location /actuator {
        return 404;
    }

    # --- Front ------------------------------------------------------------------------------
    # Hashed file names: they never change, so they can be cached for good.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Any other path is a route of the single-page app.
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
