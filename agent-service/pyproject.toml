[project]
name = "flock-agent"
version = "0.1.0"
description = "flock-ai agent service: knowledge ingestion and the LangGraph agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiokafka>=0.12",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "truststore>=0.10",
]

[project.scripts]
flock-agent = "flock_agent.agent.worker:main"
flock-ingest = "flock_agent.ingestion.cli:main"
flock-ask = "flock_agent.tools.ask:main"
flock-eval = "flock_agent.tools.evaluate:main"

[dependency-groups]
dev = [
    "datamodel-code-generator[ruff]>=0.83",
    "jsonschema[format-nongpl]>=4.23",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0",
    "ruff>=0.8",
    "trustme>=1.2",
    "types-jsonschema>=4.23",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flock_agent"]

# --- Ruff ---------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
# Same line endings on every OS (the repository stores LF, see .gitattributes).
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "S",     # flake8-bandit (security)
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "PTH",   # use pathlib
    "ASYNC", # async pitfalls
    "PT",    # pytest style
    "RUF",   # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Asserts are the point of tests.
"tests/**" = ["S101"]
# Generated from contracts/schemas: long lines are schema descriptions the formatter cannot wrap.
"src/flock_agent/contracts/generated/**" = ["E501"]

# --- mypy ---------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

# aiokafka ships no type information (no py.typed). The rest of the code only uses Kafka through
# flock_agent.common.kafka, whose own signatures are typed.
[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --- pytest -------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra lists the reason of every skipped test (e.g. missing .msg sample, T14).
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration_stack: needs the Docker Compose stack running (docker compose up -d --wait)",
]
