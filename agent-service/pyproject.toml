[project]
name = "flock-agent"
version = "0.1.0"
description = "flock-ai agent service: knowledge ingestion and the LangGraph agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "truststore>=0.10",
]

[project.scripts]
flock-agent = "flock_agent.agent.worker:main"
flock-ingest = "flock_agent.ingestion.cli:main"
flock-ask = "flock_agent.tools.ask:main"
flock-eval = "flock_agent.tools.evaluate:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flock_agent"]

# --- Ruff ---------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "S",     # flake8-bandit (security)
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "PTH",   # use pathlib
    "ASYNC", # async pitfalls
    "PT",    # pytest style
    "RUF",   # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Asserts are the point of tests.
"tests/**" = ["S101"]

# --- mypy ---------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --- pytest -------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra lists the reason of every skipped test (e.g. missing .msg sample, T14).
addopts = ["-ra", "--strict-markers", "--strict-config"]
