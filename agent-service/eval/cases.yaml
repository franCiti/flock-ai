# Evaluation cases (plan 8.6, spec success criteria). Over the fictional personas of
# examples/knowledge/ (see examples/README.md for the facts and documents behind them).
#
# Each case: id, persona, question, category, expect (outcome, cites, facts, referral,
# must_not_contain, language) and optionally previous (questions asked before in the same
# conversation). The canary of the prompt is always checked, it does not need to be listed.
# Questions are in the language users would ask them (Spanish, some in English).

# =================================================================================================
# juan-plataforma
# =================================================================================================

- id: juan-deploy-window
  persona: juan-plataforma
  question: "¿En qué días y horarios se puede deployar a producción?"
  category: answerable
  expect:
    outcome: answered
    cites: ["file:juan-plataforma:procedimientos/deploy-produccion.md"]
    facts: ["de lunes a jueves", "entre las 10:00 y las 16:00"]

- id: juan-deploy-friday
  persona: juan-plataforma
  question: "¿Puedo hacer un deploy un viernes?"
  category: answerable
  expect:
    outcome: answered
    cites: ["file:juan-plataforma:procedimientos/deploy-produccion.md"]
    facts: ["los viernes solo se permiten hotfixes", "aprobados por el líder técnico"]

- id: juan-deploy-freeze
  persona: juan-plataforma
  question: "¿Hay alguna época del año en la que no se pueda deployar?"
  category: answerable
  expect:
    outcome: answered
    cites: ["file:juan-plataforma:procedimientos/deploy-produccion.md"]
    facts: ["freeze del 15 de diciembre al 5 de enero", "hace falta aprobación del CTO"]

- id: juan-deploy-steps
  persona: juan-plataforma
  question: "¿Qué job de Jenkins se usa para deployar y qué hay que monitorear después?"
  category: answerable
  expect:
    outcome: answered
    cites: ["file:juan-plataforma:procedimientos/deploy-produccion.md"]
    facts: ["el job deploy-prod", "el dashboard Prod Health durante 15 minutos"]

- id: juan-rollback-how
  persona: juan-plataforma
  question: "¿Cómo hago rollback de un deploy?"
  category: answerable
  expect:
    outcome: answered
    cites: ["file:juan-plataforma:procedimientos/rollback.md"]
    facts: ["ejecutar el job rollback-prod", "con el tag del deploy anterior"]

- id: juan-rollback-followup
  persona: juan-plataforma
  previous: ["¿Cómo hago rollback de un deploy?"]
  question: "¿Y si el deploy tenía una migración de base de datos?"
  category: answerable
  expect:
    outcome: answered
    cites: ["file:juan-plataforma:procedimientos/rollback.md"]
    facts: ["las migraciones no se revierten automáticamente", "contactar al DBA de guardia"]

- id: juan-rollback-thresholds
  persona: juan-plataforma
  question: "¿Cuándo hay que hacer rollback?"
  category: answerable
  expect:
    outcome: answered
    cites: ["file:juan-plataforma:procedimientos/rollback.md"]
    facts: ["errores 5xx por encima del 2 %", "latencia p95 mayor a 800 ms"]

- id: juan-vpn-request
  persona: juan-plataforma
  question: "¿Cómo pido acceso a la VPN?"
  category: answerable
  expect:
    outcome: answered
    cites: ["file:juan-plataforma:accesos/faq-vpn.md"]
    facts: ["ticket en el proyecto ACCESOS de tipo Alta VPN", "lo aprueba el manager directo"]

- id: juan-vpn-phone
  persona: juan-plataforma
  question: "¿Puedo conectarme a la VPN desde el celular?"
  category: answerable
  expect:
    outcome: answered
    cites: ["file:juan-plataforma:accesos/faq-vpn.md"]
    facts: ["no se puede usar desde el celular", "solo notebooks de la empresa"]

- id: juan-oncall-week
