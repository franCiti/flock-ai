# Run all hooks on every file: pre-commit run --all-files
# Language-specific linters are added by the tasks that create each project (T02, T30, T40).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: \.(bat|cmd|ps1)$
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: fix-byte-order-marker
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  # Shell scripts.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck

  # Python (agent-service). Local hooks run through uv so they use the versions pinned in
  # agent-service/uv.lock, the same ones used when running the tools by hand.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (agent-service)
        entry: uv run --project agent-service ruff check --fix
        language: system
        types: [python]
        files: ^agent-service/
      - id: ruff-format
        name: ruff format (agent-service)
        entry: uv run --project agent-service ruff format
        language: system
        types: [python]
        files: ^agent-service/
      - id: mypy
        name: mypy (agent-service)
        entry: uv run --directory agent-service mypy
        language: system
        types: [python]
        files: ^agent-service/
        pass_filenames: false
